name: happy-pc image
on:
  push:
    branches: [happy-pc]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ghcr.io/rheckly/immich-automated-selfie-timelapse:latest
            ghcr.io/rheckly/immich-automated-selfie-timelapse:${{ github.sha }}
      - uses: actions/delete-package-versions@v5
        with:
          package-name: immich-automated-selfie-timelapse
          package-type: container
          min-versions-to-keep: 3
