<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Immich Face-Timelapse</title>
    <script>
      // Set the theme before the page renders, so it does not flash. Used by the guided view.
      // Without an own choice, the system setting counts (like Mosaik).
      (function () {
        var choice = localStorage.getItem('immich-timelapse-theme');
        var dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <!-- Tab icon (64x64); the header of the guided view shows icon.png -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
